<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #0F172A 0%, #1E293B 100%);
      color: #F1F5F9;
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      padding: 20px 18px 16px;
      position: relative;
      z-index: 1;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .header h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      flex: 1;
      background: linear-gradient(135deg, #F1F5F9, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.online { background: #22C55E; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .status-dot.focus  { background: #F59E0B; box-shadow: 0 0 8px rgba(245,158,11,0.5); animation: pulseDot 1s infinite; }

    @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ─── Pet Selector ─── */
    .pet-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .pet-selector button {
      flex: 1;
      padding: 8px 4px;
      font-size: 10px;
      font-weight: 600;
      border: 1.5px solid rgba(148,163,184,0.2);
      background: rgba(30,41,59,0.6);
      border-radius: 10px;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      opacity: .5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #94A3B8;
      font-family: inherit;
    }
    .pet-selector button .pet-emoji { font-size: 20px; filter: grayscale(0.5); transition: filter .25s; }
    .pet-selector button .pet-name { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .pet-selector button.active {
      border-color: #6366F1;
      background: rgba(99,102,241,0.12);
      opacity: 1;
      color: #F1F5F9;
      box-shadow: 0 0 20px rgba(99,102,241,0.1);
    }
    .pet-selector button.active .pet-emoji { filter: grayscale(0); }
    .pet-selector button:hover:not(.active) { border-color: rgba(148,163,184,0.4); opacity: .75; }

    /* ─── Stats Grid ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: rgba(30,41,59,0.5);
      border: 1px solid rgba(148,163,184,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      transition: border-color .2s;
    }
    .stat-card:hover { border-color: rgba(148,163,184,0.15); }
    .stat-card .stat-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #94A3B8;
    }
    .stat-card .stat-header .stat-value {
      font-weight: 700;
      color: #F1F5F9;
    }
    .stat-track {
      width: 100%;
      height: 6px;
      background: rgba(148,163,184,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .stat-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1), background 0.5s;
    }
    .stat-fill.good    { background: linear-gradient(90deg, #22C55E, #4ADE80); box-shadow: 0 0 6px rgba(34,197,94,0.2); }
    .stat-fill.warn    { background: linear-gradient(90deg, #F59E0B, #FBBF24); box-shadow: 0 0 6px rgba(245,158,11,0.2); }
    .stat-fill.danger  { background: linear-gradient(90deg, #EF4444, #F87171); box-shadow: 0 0 6px rgba(239,68,68,0.2); }

    .full-width { grid-column: 1 / -1; }

    /* ─── Mood Bar ─── */
    .mood-bar {
      text-align: center;
      margin-bottom: 14px;
      padding: 6px 0;
      font-size: 24px;
    }

    /* ─── Actions ─── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .actions button {
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      border: 1.5px solid rgba(148,163,184,0.15);
      background: rgba(30,41,59,0.4);
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #F1F5F9;
      font-family: inherit;
    }
    .actions button .emoji { font-size: 22px; }
    .actions button:hover {
      background: rgba(99,102,241,0.1);
      border-color: rgba(99,102,241,0.3);
      transform: translateY(-1px);
    }
    .actions button:active { transform: translateY(0); }
    .actions button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .actions button .cooldown-timer { font-size: 9px; color: #64748B; font-weight: 500; }

    /* ─── Focus Box ─── */
    .focus-box {
      background: rgba(30,41,59,0.5);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .focus-box .focus-label {
      font-size: 11px;
      font-weight: 700;
      color: #F59E0B;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .focus-box .timer {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      margin: 6px 0;
      font-family: 'Inter', monospace;
      color: #F1F5F9;
    }
    .focus-box .timer.running { color: #F59E0B; text-shadow: 0 0 20px rgba(245,158,11,0.2); }
    .focus-box button {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
      margin-top: 6px;
    }
    .btn-focus-start {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .btn-focus-start:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.4); }
    .btn-focus-stop {
      background: linear-gradient(135deg, #EF4444, #F87171);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(239,68,68,0.3);
    }
    .btn-focus-stop:hover { transform: translateY(-1px); }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid rgba(148,163,184,0.08);
    }
    .footer .version {
      font-size: 9px;
      color: #475569;
      letter-spacing: 0.3px;
    }
    .footer a.kofi {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 14px;
      background: linear-gradient(135deg, #FF5E5B, #FF8E53);
      color: #FFF !important;
      font-size: 10px;
      font-weight: 700;
      border-radius: 20px;
      text-decoration: none;
      transition: all .2s;
      box-shadow: 0 3px 8px rgba(255,94,91,0.2);
    }
    .footer a.kofi:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,94,91,0.3); }

    /* ─── Keyframe animations ─── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .container > * { animation: slideUp 0.3s ease-out both; }
    .container > *:nth-child(1) { animation-delay: 0s; }
    .container > *:nth-child(2) { animation-delay: 0.04s; }
    .container > *:nth-child(3) { animation-delay: 0.08s; }
    .container > *:nth-child(4) { animation-delay: 0.12s; }
    .container > *:nth-child(5) { animation-delay: 0.16s; }
    .container > *:nth-child(6) { animation-delay: 0.2s; }
    .container > *:nth-child(7) { animation-delay: 0.24s; }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">🐱</div>
    <h1>CyberPet</h1>
    <span id="statusDot" class="status-dot online"></span>
  </div>

  <!-- Pet Selector -->
  <div class="pet-selector" id="petSelector">
    <button data-pet="cat" class="active"><span class="pet-emoji">🐱</span><span class="pet-name">Cat</span></button>
    <button data-pet="shiba"><span class="pet-emoji">🐕</span><span class="pet-name">Dog</span></button>
    <button data-pet="rabbit"><span class="pet-emoji">🐰</span><span class="pet-name">Bunny</span></button>
    <button data-pet="marmot"><span class="pet-emoji">🐹</span><span class="pet-name">Marmot</span></button>
  </div>

  <!-- Mood -->
  <div class="mood-bar"><span id="moodFaces">😊</span></div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-header"><span>🍗 Fullness</span><span class="stat-value" id="val-fullness">100</span></div>
      <div class="stat-track"><div id="bar-fullness" class="stat-fill good" style="width:100%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><span>🛁 Clean</span><span class="stat-value" id="val-clean">100</span></div>
      <div class="stat-track"><div id="bar-clean" class="stat-fill good" style="width:100%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><span>❤️ Mood</span><span class="stat-value" id="val-mood">100</span></div>
      <div class="stat-track"><div id="bar-mood" class="stat-fill good" style="width:100%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><span>❤️‍🩹 Health</span><span class="stat-value" id="val-health">100</span></div>
      <div class="stat-track"><div id="bar-health" class="stat-fill good" style="width:100%"></div></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button id="btn-feed"><span class="emoji">🍖</span>Feed<span class="cooldown-timer" id="cd-feed"></span></button>
    <button id="btn-bath"><span class="emoji">🧼</span>Bath<span class="cooldown-timer" id="cd-bath"></span></button>
    <button id="btn-pet"><span class="emoji">🤚</span>Pet<span class="cooldown-timer" id="cd-pet"></span></button>
  </div>

  <!-- Focus -->
  <div class="focus-box">
    <div class="focus-label">⏱️ Pomodoro</div>
    <div class="timer" id="timerDisplay">25:00</div>
    <button id="btn-focus" class="btn-focus-start">Start Focus (25 min)</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="version">CyberPet <span id="versionDisplay">v2.0.0</span> &middot; Your desk buddy</div>
    <a href="https://ko-fi.com/boweryoung" target="_blank" rel="noopener" class="kofi">☕ Support on Ko-fi</a>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
