<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPet</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #FAFAFA;
      color: #222;
      font-size: 13px;
      line-height: 1.4;
    }

    /* ─── Header ──────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #E8E8E8;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
    }
    .header .pet-icon {
      font-size: 24px;
      line-height: 1;
    }
    .header .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.online { background: #4CAF50; }
    .status-dot.focus  { background: #FF9800; animation: pulseDot 1s infinite; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ─── Status Bars ─────────────────────────────────────────────── */
    .status-group { margin-bottom: 10px; }
    .status-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .progress-track {
      width: 100%;
      background: #E8E8E8;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    }
    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease, background 0.4s ease;
    }
    .progress-fill.good    { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
    .progress-fill.warn    { background: linear-gradient(90deg, #FF9800, #FFA726); }
    .progress-fill.danger  { background: linear-gradient(90deg, #F44336, #EF5350); }

    /* ─── Action Buttons ──────────────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin: 14px 0;
    }
    .actions button {
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: 2px solid #333;
      background: #FFF;
      box-shadow: 2px 2px 0 #333;
      cursor: pointer;
      border-radius: 6px;
      transition: transform 0.08s, box-shadow 0.08s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .actions button .emoji { font-size: 18px; }
    .actions button:hover {
      background: #F0F0F0;
    }
    .actions button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 #333;
    }
    .actions button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 2px 2px 0 #333;
    }
    .actions button .cooldown-timer {
      font-size: 9px;
      color: #999;
      font-weight: 400;
    }

    /* ─── Focus Box ───────────────────────────────────────────────── */
    .focus-box {
      background: #FFFDE7;
      border: 2px dashed #FFBC00;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 8px;
    }
    .focus-box .focus-label {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #F57F17;
    }
    .focus-box .timer {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
    }
    .focus-box .timer.running { color: #E65100; }
    .focus-box button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid #333;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
      margin-top: 4px;
    }
    .btn-focus-start {
      background: #4CAF50;
      color: #FFF;
      box-shadow: 2px 2px 0 #2E7D32;
    }
    .btn-focus-start:hover { background: #43A047; }
    .btn-focus-stop {
      background: #F44336;
      color: #FFF;
      box-shadow: 2px 2px 0 #C62828;
    }
    .btn-focus-stop:hover { background: #E53935; }
    .focus-box button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 #333;
    }
    .focus-box button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── Mood emoji indicator ────────────────────────────────────── */
    .mood-indicator {
      text-align: center;
      font-size: 14px;
      padding: 4px 0 2px 0;
    }
    .mood-indicator .faces {
      font-size: 20px;
    }

    /* ─── Pet Selector ─────────────────────────────────────────────── */
    .pet-selector {
      display: flex;
      gap: 4px;
      margin: 10px 0 12px 0;
      justify-content: center;
    }
    .pet-selector button {
      flex:1;
      padding: 6px 2px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid #DDD;
      background: #FFF;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      opacity: .5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .pet-selector button .pet-emoji { font-size: 18px; }
    .pet-selector button .pet-name { font-size: 9px; color: #666; }
    .pet-selector button.active {
      border-color: #FF9800;
      background: #FFF8E1;
      opacity: 1;
      box-shadow: 0 0 6px rgba(255,152,0,0.2);
    }
    .pet-selector button:hover:not(.active) {
      border-color: #BBB;
      opacity: .8;
    }

    /* ─── Footer ──────────────────────────────────────────────────── */
    /* ─── SVG Icon sizing ─── */
    .icon { width: 16px; height: 16px; display: inline-block; vertical-align: middle; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 14px; height: 14px; }
    .icon-lg { width: 20px; height: 20px; }
    .icon-heart { fill: none; }
    .stat-header .icon { margin-right: 3px; opacity: 0.7; }
    .actions button .icon { width: 22px; height: 22px; margin-bottom: 1px; }

    .footer {
      font-size: 9px;
      color: #BBB;
      text-align: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #EEE;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="pet-icon" id="petIconHeader">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-4.5 0-8 3.5-8 8s3.5 8 8 8 8-3.5 8-8-3.5-8-8-8z"/><path d="M9 12c0 .5.5 1 1 1h4c.5 0 1-.5 1-1"/><path d="M9 10c.5 0 1 .5 1 1"/><path d="M14 10c.5 0 1 .5 1 1"/></svg>
    </span>
    <h1>CyberPet</h1>
    <span id="statusDot" class="status-dot online"></span>
  </div>

  <!-- Pet Selector -->
  <div class="pet-selector" id="petSelector">
    <button data-pet="cat" class="active"><span class="pet-emoji">😺</span><span class="pet-name">Cat</span></button>
    <button data-pet="shiba"><span class="pet-emoji">🐶</span><span class="pet-name">Dog</span></button>
    <button data-pet="rabbit"><span class="pet-emoji">🐇</span><span class="pet-name">Bunny</span></button>
    <button data-pet="marmot"><span class="pet-emoji">🐿️</span><span class="pet-name">Marmot</span></button>
  </div>

  <!-- Mood -->
  <div class="mood-indicator">
    <span id="moodFaces">😊</span>
  </div>

  <!-- Status Bars -->
  <div class="status-group">
    <div class="status-label">
      <span><svg class="icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>Fullness</span>
      <span id="val-fullness">100</span>
    </div>
    <div class="progress-track"><div id="bar-fullness" class="progress-fill good" style="width:100%"></div></div>
  </div>

  <div class="status-group">
    <div class="status-label">
      <span><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Cleanliness</span>
      <span id="val-clean">100</span>
    </div>
    <div class="progress-track"><div id="bar-clean" class="progress-fill good" style="width:100%"></div></div>
  </div>

  <div class="status-group">
    <div class="status-label">
      <span><svg class="icon icon-heart" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Mood</span>
      <span id="val-mood">100</span>
    </div>
    <div class="progress-track"><div id="bar-mood" class="progress-fill good" style="width:100%"></div></div>
  </div>

  <div class="status-group">
    <div class="status-label">
      <span><svg class="icon" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Health</span>
      <span id="val-health">100</span>
    </div>
    <div class="progress-track"><div id="bar-health" class="progress-fill good" style="width:100%"></div></div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button id="btn-feed">
      <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Feed
      <span class="cooldown-timer" id="cd-feed"></span>
    </button>
    <button id="btn-bath">
      <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 12a11 11 0 0 1-22 0c0-5 3-9 11-11 8 2 11 6 11 11z"/></svg>
      Bath
      <span class="cooldown-timer" id="cd-bath"></span>
    </button>
    <button id="btn-pet">
      <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="11" r="2"/><circle cx="17" cy="11" r="2"/><path d="M12 17c2 0 4-1 5-3"/><path d="M19 8c-1-1-3-1-4 0"/><path d="M5 8c1-1 3-1 4 0"/></svg>
      Pet
      <span class="cooldown-timer" id="cd-pet"></span>
    </button>
  </div>

  <!-- Focus Timer -->
  <div class="focus-box">
    <div class="focus-label">⏱️ Pomodoro Timer</div>
    <div class="timer" id="timerDisplay">25:00</div>
    <button id="btn-focus" class="btn-focus-start">Start Focus (25 min)</button>
  </div>

  <!-- Ko-fi Support -->
  <div style="text-align:center;margin-bottom:8px">
    <a href="https://ko-fi.com/boweryoung" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:6px 16px;background:linear-gradient(135deg,#FF5E5B,#FF8E53);color:#FFF!important;font-size:12px;font-weight:700;border-radius:20px;text-decoration:none;box-shadow:0 2px 8px rgba(255,94,91,0.3)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      Support on Ko-fi
    </a>
  </div>

  <!-- Footer -->
  <div class="footer">
    CyberPet <span id="versionDisplay">v2.0.0</span> &middot; Your desk buddy
  </div>

  <script src="popup.js"></script>
</body>
</html>
