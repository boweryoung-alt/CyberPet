<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPet</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #FAFAFA;
      color: #222;
      font-size: 13px;
      line-height: 1.4;
    }

    /* ─── Header ──────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #E8E8E8;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
    }
    .header .pet-icon {
      font-size: 24px;
      line-height: 1;
    }
    .header .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.online { background: #4CAF50; }
    .status-dot.focus  { background: #FF9800; animation: pulseDot 1s infinite; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ─── Status Bars ─────────────────────────────────────────────── */
    .status-group { margin-bottom: 10px; }
    .status-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .progress-track {
      width: 100%;
      background: #E8E8E8;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    }
    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease, background 0.4s ease;
    }
    .progress-fill.good    { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
    .progress-fill.warn    { background: linear-gradient(90deg, #FF9800, #FFA726); }
    .progress-fill.danger  { background: linear-gradient(90deg, #F44336, #EF5350); }

    /* ─── Action Buttons ──────────────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin: 14px 0;
    }
    .actions button {
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: 2px solid #333;
      background: #FFF;
      box-shadow: 2px 2px 0 #333;
      cursor: pointer;
      border-radius: 6px;
      transition: transform 0.08s, box-shadow 0.08s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .actions button .emoji { font-size: 18px; }
    .actions button:hover {
      background: #F0F0F0;
    }
    .actions button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 #333;
    }
    .actions button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 2px 2px 0 #333;
    }
    .actions button .cooldown-timer {
      font-size: 9px;
      color: #999;
      font-weight: 400;
    }

    /* ─── Focus Box ───────────────────────────────────────────────── */
    .focus-box {
      background: #FFFDE7;
      border: 2px dashed #FFBC00;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 8px;
    }
    .focus-box .focus-label {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #F57F17;
    }
    .focus-box .timer {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
    }
    .focus-box .timer.running { color: #E65100; }
    .focus-box button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid #333;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
      margin-top: 4px;
    }
    .btn-focus-start {
      background: #4CAF50;
      color: #FFF;
      box-shadow: 2px 2px 0 #2E7D32;
    }
    .btn-focus-start:hover { background: #43A047; }
    .btn-focus-stop {
      background: #F44336;
      color: #FFF;
      box-shadow: 2px 2px 0 #C62828;
    }
    .btn-focus-stop:hover { background: #E53935; }
    .focus-box button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 #333;
    }
    .focus-box button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── Mood emoji indicator ────────────────────────────────────── */
    .mood-indicator {
      text-align: center;
      font-size: 14px;
      padding: 4px 0 2px 0;
    }
    .mood-indicator .faces {
      font-size: 20px;
    }

    /* ─── Pet Selector ─────────────────────────────────────────────── */
    .pet-selector {
      display: flex;
      gap: 4px;
      margin: 10px 0 12px 0;
      justify-content: center;
    }
    .pet-selector button {
      flex:1;
      padding: 6px 2px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid #DDD;
      background: #FFF;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      opacity: .5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .pet-selector button .pet-emoji { font-size: 18px; }
    .pet-selector button .pet-name { font-size: 9px; color: #666; }
    .pet-selector button.active {
      border-color: #FF9800;
      background: #FFF8E1;
      opacity: 1;
      box-shadow: 0 0 6px rgba(255,152,0,0.2);
    }
    .pet-selector button:hover:not(.active) {
      border-color: #BBB;
      opacity: .8;
    }

    /* ─── Footer ──────────────────────────────────────────────────── */
    .footer {
      font-size: 9px;
      color: #BBB;
      text-align: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #EEE;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="pet-icon">🐱</span>
    <h1>CyberPet</h1>
    <span id="statusDot" class="status-dot online"></span>
  </div>

  <!-- Pet Selector -->
  <div class="pet-selector" id="petSelector">
    <button data-pet="cat" class="active"><span class="pet-emoji">🐱</span><span class="pet-name">Cat</span></button>
    <button data-pet="shiba"><span class="pet-emoji">🐕</span><span class="pet-name">Shiba</span></button>
    <button data-pet="rabbit"><span class="pet-emoji">🐰</span><span class="pet-name">Bunny</span></button>
    <button data-pet="marmot"><span class="pet-emoji">🐹</span><span class="pet-name">Marmot</span></button>
  </div>

  <!-- Mood indicator -->
  <div class="mood-indicator">
    <span id="moodFaces">😊</span>
  </div>

  <!-- Status Bars -->
  <div class="status-group">
    <div class="status-label">
      <span>🍗 Fullness</span>
      <span id="val-fullness">100</span>
    </div>
    <div class="progress-track">
      <div id="bar-fullness" class="progress-fill good" style="width:100%"></div>
    </div>
  </div>

  <div class="status-group">
    <div class="status-label">
      <span>🛁 Cleanliness</span>
      <span id="val-clean">100</span>
    </div>
    <div class="progress-track">
      <div id="bar-clean" class="progress-fill good" style="width:100%"></div>
    </div>
  </div>

  <div class="status-group">
    <div class="status-label">
      <span>❤️ Mood</span>
      <span id="val-mood">100</span>
    </div>
    <div class="progress-track">
      <div id="bar-mood" class="progress-fill good" style="width:100%"></div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button id="btn-feed">
      <span class="emoji">🍖</span>
      Feed
      <span class="cooldown-timer" id="cd-feed"></span>
    </button>
    <button id="btn-bath">
      <span class="emoji">🧼</span>
      Bath
      <span class="cooldown-timer" id="cd-bath"></span>
    </button>
    <button id="btn-pet">
      <span class="emoji">🤚</span>
      Pet
      <span class="cooldown-timer" id="cd-pet"></span>
    </button>
  </div>

  <!-- Focus Timer -->
  <div class="focus-box">
    <div class="focus-label">⏱️ Pomodoro Timer</div>
    <div class="timer" id="timerDisplay">25:00</div>
    <button id="btn-focus" class="btn-focus-start">Start Focus (25 min)</button>
  </div>

  <!-- Footer -->
  <div class="footer">CyberPet <span id="versionDisplay">v1.0.0</span> &#183; Your desk buddy</div>

  <script src="popup.js"></script>
</body>
</html>
